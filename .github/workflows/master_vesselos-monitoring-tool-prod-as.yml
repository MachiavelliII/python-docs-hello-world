# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - vesselos-monitoring-tool-prod-as
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_742423A1FB8941A48C8AA15452391A94 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F33176F36FA141298082AE88EE492B49 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_249D7052ECA4474EADED5B2F6EEABBF2 }}

      # ✅ Inject secrets as Azure App Settings (available as env vars at runtime)
      - name: Set Azure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'vesselos-monitoring-tool-prod-as'
          app-settings-json: |
            [
              {
                "name": "DISCORD_WEBHOOK_URL",
                "value": "${{ secrets.DISCORD_WEBHOOK_URL }}",
                "slotSetting": false
              }
            ]

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'vesselos-monitoring-tool-prod-as'
          slot-name: 'Production'